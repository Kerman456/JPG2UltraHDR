name: android

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: android-app

env:
  APP_LIB_NAME: jpg2ultrahdr_android
  APP_PACKAGE: com.kerman456.jpg2ultrahdr
  NDK_VERSION: 27.3.13750724
  BUILD_TOOLS: 35.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest 已预装 Android SDK；不要用 android-actions/setup-android，
      # 它会执行已被移除的 `sdkmanager tools` 并失败。
      - name: Install NDK and build-tools
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          # runner 上 sdkmanager 不在 PATH 里，自己找一下 cmdline-tools
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$SM" ] || [ ! -x "$SM/sdkmanager" ]; then
            echo "找不到 sdkmanager"; ls -R "$ANDROID_HOME/cmdline-tools" | head -40; exit 1
          fi
          export PATH="$SM:$PATH"
          echo "$SM" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android-app

      - name: Build Rust library (arm64-v8a)
        run: |
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          # 版本号只在 app/build.gradle 里写一次，产物名从那里取
          VERSION=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          OUT="android/app/build/outputs/apk/release/JPG2UltraHDR-${VERSION}-arm64.apk"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            # 有正式密钥就用它，这样老用户能覆盖安装
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASS"
          else
            # 没有密钥时生成一次性密钥：产物可安装，但和正式版签名不同，
            # 装上之后无法用正式版覆盖，仅作 CI 冒烟用
            echo "::warning::ANDROID_KEYSTORE_B64 未配置，本次用临时密钥签名"
            PASS="ci-temp-$(date +%s)-$RANDOM"
            keytool -genkeypair -keystore release.jks -storetype JKS \
              -alias jpg2ultrahdr -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=CI, OU=Dev, O=JPG2UltraHDR, L=Shanghai, ST=Shanghai, C=CN"
          fi

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$OUT"
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" --ks-key-alias jpg2ultrahdr "$OUT"
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: jpg2ultrahdr-android
          path: ${{ env.APK }}
